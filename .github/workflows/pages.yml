name: report

# Публикует reports/ (итоговый HTML-отчёт и графики) на GitHub Pages.
# Запускается вручную (Actions -> report -> Run workflow) после того, как в
# Settings -> Pages выбран источник "GitHub Actions".
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: reports
      - id: deployment
        uses: actions/deploy-pages@v4
